<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Nova 2 — icône d'app (source). Dérivée du glyphe « orb » de web/js/icons.js :
       cercle + étoile à 4 branches, sur le « vide spatial » de la direction artistique
       (recherche_design_2026.md §5.1) et l'accent unique orange solaire #FF7A29.
       Le PNG 1024 (AppIcon-1024.png) est généré depuis ce dessin par make_icon.py ;
       package_app.sh en dérive AppIcon.icns avec sips/iconutil sur le Mac. -->
  <defs>
    <linearGradient id="void" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0D1020"/>
      <stop offset="1" stop-color="#07080F"/>
    </linearGradient>
    <radialGradient id="orb" cx="0.38" cy="0.34" r="0.95">
      <stop offset="0" stop-color="#FFC38F"/>
      <stop offset="0.45" stop-color="#FF7A29"/>
      <stop offset="1" stop-color="#C24E12"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FF7A29" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FF7A29" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="190" fill="url(#void)"/>
  <circle cx="512" cy="512" r="330" fill="url(#glow)"/>
  <circle cx="512" cy="512" r="218" fill="url(#orb)"/>
  <circle cx="512" cy="512" r="218" fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="6"/>
  <!-- étoile à 4 branches : tracé « orb » de icons.js (grille 24) mis à l'échelle -->
  <path transform="translate(512 512) scale(18.2) translate(-12 -12)" fill="#FFF6EC"
        d="M12 5.8l1.5 4.7 4.7 1.5-4.7 1.5L12 18.2l-1.5-4.7L5.8 12l4.7-1.5z"/>
</svg>
